services:
  - type: web
    name: fastapi-redis-counter
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: counter-redis
          property: connectionString

  - type: keyvalue
    name: counter-redis
    plan: starter
    maxmemoryPolicy: noeviction
